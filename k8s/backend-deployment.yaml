apiVersion: apps/v1
kind: Deployment
metadata:
  name: querylens-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: querylens-backend
  template:
    metadata:
      labels:
        app: querylens-backend
    spec:
      containers:
      - name: backend
        image: querylens-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: querylens-config
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: querylens-backend
  ports:
  - port: 8000
    targetPort: 8000
