services:
  # ── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: querylens-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-querylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-querylens_secret}
      POSTGRES_DB: ${POSTGRES_DB:-querylens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./data.csv:/docker-entrypoint-initdb.d/data.csv
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querylens"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querylens-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://readonly_user:readonly_pass@db:5432/querylens
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ── React Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: querylens-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
