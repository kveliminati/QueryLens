version: '3.8'

services:
  # 1. FastAPI Backend API & WebSocket Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - POSTGRES_URL=postgresql://querylens_user:querylens_pass@postgres:5432/querylens_db
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: always

  # 2. React Frontend Web Application (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  # 3. PostgreSQL Database Instance
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=querylens_db
      - POSTGRES_USER=querylens_user
      - POSTGRES_PASSWORD=querylens_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Redis Session Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # 5. Elasticsearch Entity Repository
  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 6. Prometheus System Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # 7. Grafana Metrics Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  es_data:
